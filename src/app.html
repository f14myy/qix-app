<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f7f9ec" />
		<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
		<!--
			Same first-paint theme bootstrap as the site, moved into a file because
			the app's CSP forbids inline scripts. It must stay render-blocking and
			stay above the stylesheet, or the wrong palette flashes.
		-->
		<script src="/theme-boot.js"></script>
		<!-- Vendored copies of the site's webfonts, so offline renders identically. -->
		<link rel="stylesheet" href="/fonts/fonts.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
